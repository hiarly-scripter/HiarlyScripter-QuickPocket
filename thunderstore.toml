[config]
schemaVersion = "0.0.1"

[package]
namespace = "HiarlyScripter"
name = "QuickPocket"
versionNumber = "1.0.12"
description = "Guarde itens pequenos no bolso e solte depois, com HUD e multiplayer. / Pocket small items and drop them later, with HUD and multiplayer."
websiteUrl = "https://github.com/hiarly-scripter/HiarlyScripter-QuickPocket"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack" = "5.4.2305"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[[build.copy]]
source = "./build/HiarlyScripter-QuickPocket.dll"
target = "BepInEx/plugins/HiarlyScripter-QuickPocket/HiarlyScripter-QuickPocket.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "repo", ]

[publish.categories]
repo = [ "mods", "quality-of-life", "ai-generated", ]
